<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Invoice Document Icon (Cyan/Blue) -->
  <g transform="translate(18, 12)">
    <path d="M 4 2 L 24 2 C 26 2 28 4 28 6 L 28 38 C 28 40 26 42 24 42 L 4 42 C 2 42 0 40 0 38 L 0 6 C 0 4 2 2 4 2 Z" fill="#0ea5e9" opacity="0.95"/>
    <path d="M 20 2 L 28 10 L 20 10 Z" fill="#0284c7"/>
    <rect x="5" y="12" width="12" height="2.5" rx="1" fill="#ffffff" opacity="0.85"/>
    <rect x="5" y="18" width="17" height="2.5" rx="1" fill="#ffffff" opacity="0.85"/>
    <rect x="5" y="24" width="10" height="2.5" rx="1" fill="#ffffff" opacity="0.85"/>
    <text x="16" y="36" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff">$</text>
  </g>
  <!-- Lightning Bolt Icon (Glowing Yellow) -->
  <g filter="url(#glow)">
    <polygon points="26,6 10,32 22,32 16,58 46,24 30,24" fill="#eab308"/>
    <polygon points="26,6 10,32 22,32 16,58 46,24 30,24" fill="#fde047"/>
  </g>
</svg>
